<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="楽ブレ - Googleアカウントでログイン">
  <title>ログイン｜楽ブレ</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #111827;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --background: #f8fafc;
      --card: #ffffff;
      --success: #15803d;
      --error: #dc2626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 0%, #eef2ff 0%, transparent 38%),
        var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 560px;
      padding: 42px 32px 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .logo {
  display: block;
  width: 180px;
  max-width: 70%;
  height: auto;
  margin: 0 auto 24px;
  object-fit: contain;
}
    
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.4;
      letter-spacing: -0.5px;
    }

    .lead {
      margin: 18px 0 32px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .google-login {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .status.error { color: var(--error); }
    .status.success { color: var(--success); }

    .loading {
      display: none;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .loading.show { display: block; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 34px 0 20px;
      color: #9ca3af;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .notice {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }

    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .login-card {
        padding: 34px 20px 26px;
        border-radius: 20px;
      }
      h1 { font-size: 25px; }
      .lead { font-size: 14px; }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <img
  src="./assets/rakubure-logo.png"
  alt="楽ブレ"
  class="logo"
>

    <h1>楽ブレへようこそ</h1>

    <p class="lead">
      Googleアカウントでログインして、<br>
      履歴書・職務経歴書などの作成をはじめましょう。
    </p>

    <!-- Google OAuth Client ID -->
    <div
      id="g_id_onload"
      data-client_id="490441638610-hb6vqjd0o1a608n8glubko8kta5el407.apps.googleusercontent.com"
      data-callback="handleGoogleCredential"
      data-auto_prompt="false">
    </div>

    <div class="google-login">
      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="signin_with"
        data-shape="rectangular"
        data-logo_alignment="left"
        data-width="320">
      </div>
    </div>

    <div id="loading" class="loading">Google認証を確認しています…</div>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div class="divider">ご利用について</div>

    <p class="notice">
      ログインにはGoogleアカウントを使用します。<br>
      認証が確認された場合のみ、楽ブレ本体ページへ移動します。
    </p>

    <div class="footer">© 2026 Version-K / 楽ブレ</div>
  </main>

  <script>
    "use strict";

    const RAKUBURE_LOGIN_CONFIG = {
      GOOGLE_CLIENT_ID:
        "490441638610-hb6vqjd0o1a608n8glubko8kta5el407.apps.googleusercontent.com",

      GAS_WEB_APP_URL:
        "https://script.google.com/macros/s/AKfycbybptovZ67BMtkDaC7tRBLHFoQS9DXbr43oeEiSBmOfsXBTK3bwA800baKvpOMOo0yn/exec",

      APP_URL: "./index.html"
    };

    /**
     * Google Identity ServicesからIDトークンを受け取り、
     * GAS側で認証確認を行います。
     *
     * GASの doPost(e) には action === "auth" の分岐が必要です。
     * ブラウザからGASへのfetchはCORS等で失敗する可能性があります。
     * 認証に失敗した場合は本体へ移動しません。
     */
    async function handleGoogleCredential(response) {
      if (!response || !response.credential) {
        showStatus(
          "Googleログイン情報を取得できませんでした。もう一度お試しください。",
          "error"
        );
        return;
      }

      setLoading(true);
      showStatus("Googleアカウントを確認しています…");

      sessionStorage.removeItem("RAKUBURE_GOOGLE_CREDENTIAL");
      sessionStorage.removeItem("RAKUBURE_GOOGLE_EMAIL");

      try {
        const gasResponse = await fetch(
          RAKUBURE_LOGIN_CONFIG.GAS_WEB_APP_URL,
          {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=UTF-8"
            },
            body: JSON.stringify({
              action: "auth",
              googleCredential: response.credential
            }),
            redirect: "follow",
            cache: "no-store"
          }
        );

        if (!gasResponse.ok) {
          throw new Error(
            "GASからHTTP " + gasResponse.status +
            " が返されました。デプロイ設定を確認してください。"
          );
        }

        const result = await gasResponse.json();

        if (
          !result ||
          result.success !== true ||
          result.authenticated !== true
        ) {
          throw new Error(
            result && (result.message || result.error)
              ? (result.message || result.error)
              : "このGoogleアカウントは利用できないか、認証に失敗しました。"
          );
        }

        // 本体側でもGASがIDトークンを再検証することが必須
        sessionStorage.setItem(
          "RAKUBURE_GOOGLE_CREDENTIAL",
          response.credential
        );
        sessionStorage.setItem(
          "RAKUBURE_GOOGLE_EMAIL",
          String(result.email || "")
        );

        showStatus(
          "認証に成功しました。楽ブレを起動します。",
          "success"
        );

        window.setTimeout(() => {
          window.location.replace(RAKUBURE_LOGIN_CONFIG.APP_URL);
        }, 400);

      } catch (error) {
        console.error("Rakubure login error:", error);

        sessionStorage.removeItem("RAKUBURE_GOOGLE_CREDENTIAL");
        sessionStorage.removeItem("RAKUBURE_GOOGLE_EMAIL");

        let detail = error && error.message
          ? error.message
          : "不明なエラー";

        if (
          error instanceof TypeError ||
          /Failed to fetch|Load failed/i.test(detail)
        ) {
          detail =
            "GASとの通信に失敗しました。Webアプリのデプロイ設定、" +
            "URL、ブラウザの通信制限を確認してください。";
        }

        showStatus(
          "ログインを完了できませんでした。\n" + detail,
          "error"
        );
      } finally {
        setLoading(false);
      }
    }

    function showStatus(message, type = "") {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = "status";
      if (type) status.classList.add(type);
    }

    function setLoading(isLoading) {
      document.getElementById("loading")
        .classList.toggle("show", isLoading);
    }

    window.addEventListener("load", () => {
      if (!RAKUBURE_LOGIN_CONFIG.GOOGLE_CLIENT_ID) {
        showStatus("Google Client IDが設定されていません。", "error");
      }

      if (!window.google || !window.google.accounts) {
        showStatus(
          "Googleログインを読み込めませんでした。ネットワークを確認して再読み込みしてください。",
          "error"
        );
      }
    });
  </script>
</body>
</html>
