<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="楽ブレ - Googleアカウントでログイン">
  <title>ログイン｜楽ブレ</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --error: #dc2626;
      --success: #15803d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: var(--primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Yu Gothic", Meiryo, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 560px;

      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .07);

    .logo {
      width: 80px;

    .google-login {
      min-height: 48px;

      justify-content: center;

    #status {
      margin-top: 20px;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.8;
      font-size: 14px;
    }

    #status.error { color: var(--error); }
    #status.success { color: var(--success); }

    #loading { display: none; margin-top: 12px; color: var(--muted); }
    #loading.show { display: block; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 34px 0 20px;

      content: "";

  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-label="楽ブレ">楽</div>

    <h1>楽ブレへようこそ</h1>

    <p class="lead">
      Googleアカウントでログインして、<br>
      履歴書・職務経歴書などの作成をはじめましょう。
    </p>

    <div
      id="g_id_onload"
      data-client_id="490441638610-hb6vqjd0o1a608n8glubko8kta5el407.apps.googleusercontent.com"
      data-callback="handleGoogleCredential"
      data-auto_prompt="false">
    </div>

    <div class="google-login">
      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="signin_with"
        data-shape="rectangular"
        data-logo_alignment="left">
      </div>
    </div>

    <div id="loading">Google認証を確認しています…</div>
    <div id="status" role="status" aria-live="polite"></div>

    <div class="divider">ご利用について</div>

    <p class="notice">
      ログインにはGoogleアカウントを使用します。<br>
      GAS側で認証が確認された場合のみ、本体ページへ移動します。
    </p>

    <footer>© 2026 Version-K / 楽ブレ</footer>
  </main>

  <script>
    "use strict";

    const CONFIG = {
      CLIENT_ID:
        "490441638610-hb6vqjd0o1a608n8glubko8kta5el407.apps.googleusercontent.com",

      GAS_URL:
        "https://script.google.com/macros/s/AKfycbybptovZ67BMtkDaC7tRBLHFoQS9DXbr43oeEiSBmOfsXBTK3bwA800baKvpOMOo0yn/exec",

      APP_URL: "./index.html"
    };

    function setStatus(message, type = "") {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = type;
    }

    function setLoading(loading) {
      document.getElementById("loading").classList.toggle("show", loading);
    }

    async function handleGoogleCredential(response) {
      if (!response || !response.credential) {
        setStatus("Google認証情報を取得できませんでした。再度お試しください。", "error");
        return;
      }

      setLoading(true);
      setStatus("Googleアカウントを確認しています…");

      sessionStorage.removeItem("RAKUBURE_GOOGLE_CREDENTIAL");
      sessionStorage.removeItem("RAKUBURE_GOOGLE_EMAIL");

      try {
        /*
         * GAS側に action === "auth" の処理が必要です。
         * GAS側でGoogle IDトークンの署名・audience・有効期限・
         * 許可メールアドレスを検証してください。
         */
        const responseFromGas = await fetch(CONFIG.GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify({
            action: "auth",
            googleCredential: response.credential
          }),
          redirect: "follow",
          cache: "no-store"
        });

        if (!responseFromGas.ok) {
          throw new Error(
            "GASからHTTP " + responseFromGas.status +
            " が返されました。デプロイ設定を確認してください。"
          );
        }

        const result = await responseFromGas.json();

        if (
          result.success !== true ||
          result.authenticated !== true
        ) {
          throw new Error(
            result.message ||
            result.error ||
            "このGoogleアカウントは利用できないか、認証に失敗しました。"
          );
        }

        /*
         * 認証確認が成功した場合のみ保存します。
         * 本体側でもトークンをGASに送信し、毎回検証してください。
         */
        sessionStorage.setItem(
          "RAKUBURE_GOOGLE_CREDENTIAL",
          response.credential
        );

        sessionStorage.setItem(
          "RAKUBURE_GOOGLE_EMAIL",
          String(result.email || "")
        );

        setStatus("認証に成功しました。本体ページへ移動します。", "success");

        window.location.replace(CONFIG.APP_URL);

      } catch (error) {
        console.error("Rakubure authentication error:", error);

        sessionStorage.removeItem("RAKUBURE_GOOGLE_CREDENTIAL");
        sessionStorage.removeItem("RAKUBURE_GOOGLE_EMAIL");

        let detail = error?.message || "不明なエラー";

        if (
          error instanceof TypeError ||
          /Failed to fetch|Load failed/i.test(detail)
        ) {
          detail =
            "GASとの通信に失敗しました。\n" +
            "GASのWebアプリ公開設定、デプロイURL、ブラウザの通信制限を確認してください。";
        }

        setStatus(
          "ログインを完了できませんでした。\n" + detail,
          "error"
        );

      } finally {
        setLoading(false);
      }
    }

    window.addEventListener("load", () => {
      if (!window.google || !window.google.accounts) {
        setStatus(
          "Googleログインを読み込めませんでした。ページを再読み込みしてください。",
          "error"
        );
      }
    });
  </script>
</body>
</html>
