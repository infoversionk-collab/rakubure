<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>楽ブレ 管理画面</title>
<style>
:root{--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f5f7fb;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:#111827;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800}.brand small{display:block;color:#cbd5e1;font-size:12px;font-weight:500}
main{max-width:1200px;margin:28px auto;padding:0 18px 40px}.notice{padding:14px 16px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:12px;font-size:13px;line-height:1.7;margin-bottom:18px}
h1{font-size:27px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted)}
.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat,.panel,.login-card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #10182808}
.stat{padding:16px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:28px;font-weight:800;margin-top:7px}
.toolbar{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
input,select{font:inherit;border:1px solid #d0d5dd;border-radius:9px;padding:10px 12px;background:white}input{min-width:240px}
button{font:inherit;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#eef2f6;color:#344054}.approve{background:#dcfce7;color:#166534}.suspend{background:#fee2e2;color:#991b1b}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{font-size:12px;color:#475467;background:#fafafa}
.email{font-weight:700;overflow-wrap:anywhere}.uid{font:11px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere;max-width:220px}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.suspended{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:35px 14px}
.message{display:none;padding:12px 14px;border-radius:10px;font-size:13px;white-space:pre-wrap;margin-bottom:16px}.message.show{display:block}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.login-card{max-width:480px;margin:65px auto;padding:32px;text-align:center}.logo{width:62px;height:62px;display:grid;place-items:center;border-radius:18px;background:#111827;color:white;font-size:31px;font-weight:900;margin:0 auto 18px}.login-card h1{font-size:24px}.login-card p{color:var(--muted);font-size:14px;line-height:1.8;margin:12px 0 22px}
.hidden{display:none!important}footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:20px}
@media(max-width:700px){header{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-value{font-size:24px}input{min-width:0;width:100%}}
</style>
</head>
<body>
<header><div class="brand">楽ブレ<small>管理者コンソール</small></div><div><span id="currentUser"></span> <button id="signOutBtn" class="secondary hidden">ログアウト</button></div></header>
<main>
<section id="loginView" class="login-card"><div class="logo">楽</div><h1>管理者ログイン</h1><p>ユーザーの利用申請・承認・利用停止を管理します。<br>管理者として登録されたGoogleアカウントのみ利用できます。</p><button id="signInBtn" class="primary">Googleでログイン</button><div id="loginMessage" class="message" style="margin-top:16px;text-align:left"></div></section>
<section id="adminView" class="hidden">
<div class="notice"><b>管理者専用画面</b><br>管理者の許可リストに登録されたアカウントのみ利用できます。データ保護のため、Firestoreのセキュリティルールでも管理者以外の読み書きを制限してください。</div>
<div id="message" class="message"></div><div class="hero"><div><h1>ユーザー管理</h1><div class="sub">Firestore の <code>users/{UID}</code> を管理します。</div></div><button id="refreshBtn" class="secondary">一覧を更新</button></div>
<div class="stats"><div class="stat"><div class="stat-label">全ユーザー</div><div class="stat-value" id="countAll">—</div></div><div class="stat"><div class="stat-label">承認待ち</div><div class="stat-value" id="countPending">—</div></div><div class="stat"><div class="stat-label">利用中</div><div class="stat-value" id="countApproved">—</div></div><div class="stat"><div class="stat-label">停止中</div><div class="stat-value" id="countSuspended">—</div></div></div>
<div class="panel"><div class="toolbar"><input id="searchInput" type="search" placeholder="メールアドレス・UIDで検索"><select id="statusFilter"><option value="all">すべてのステータス</option><option value="pending">承認待ち</option><option value="approved">利用中</option><option value="suspended">停止中</option></select><span id="resultCount" class="sub"></span></div>
<div class="table-wrap"><table><thead><tr><th>ユーザー</th><th>UID</th><th>ステータス</th><th>登録日時</th><th>操作</th></tr></thead><tbody id="usersBody"><tr><td colspan="5" class="empty">読み込み待ちです。</td></tr></tbody></table></div></div><footer>楽ブレ 管理画面</footer>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* Firebaseコンソール > プロジェクトの設定 > 全般 > マイアプリ のWebアプリ設定を入れてください */

const firebaseConfig = {
  apiKey: "AIzaSyCzgjQszPcB-NjlmkyE3us7G_X-rM1x24Q",
  authDomain: "rakubure-jidouseisei.firebaseapp.com",
  projectId: "rakubure-jidouseisei",
  storageBucket: "rakubure-jidouseisei.firebasestorage.app",
  messagingSenderId: "490441638610",
  appId: "1:490441638610:web:6b24bddf3d81762623230b",
  measurementId: "G-G52DYVZFJJ"
};

/* 管理者本人のFirebase Authentication UIDを設定。メールアドレスではなくUIDを使う */
const ADMIN_UIDS = ["brXaOJ96fBdPUtn5viOIaHjndbl1"];
const $=id=>document.getElementById(id);
let auth,db,users=[];
function msg(el,text,type="info"){el.textContent=text;el.className="message show "+type}
function clearMsg(el){el.textContent="";el.className="message"}
function configured() {
  const configComplete = Boolean(firebaseConfig.apiKey) &&
    Boolean(firebaseConfig.authDomain) &&
    Boolean(firebaseConfig.projectId) &&
    Boolean(firebaseConfig.appId) &&
    !firebaseConfig.apiKey.startsWith("YOUR_");
  const adminListComplete = ADMIN_UIDS.length > 0 &&
    ADMIN_UIDS.every(uid => uid && !uid.startsWith("REPLACE_"));
  return configComplete && adminListComplete;
}
function statusOf(u){if(u.status==="suspended"||u.status==="SUSPENDED")return "suspended";if(u.approved===true&&u.status==="approved")return "approved";return "pending"}
function dateOf(v){if(!v)return "—";let d=typeof v.toDate==="function"?v.toDate():new Date(v);return isNaN(d.getTime())?"—":d.toLocaleString("ja-JP")}
function el(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function login(){clearMsg($("loginMessage"));if(!configured()){msg($("loginMessage"),"初期設定が未完了です。firebaseConfig と ADMIN_UIDS を設定してください。","error");return}try{let p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await auth.signInWithPopup(p)}catch(e){msg($("loginMessage"),"ログインできませんでした: "+e.message,"error")}}
function loginView(){ $("loginView").classList.remove("hidden");$("adminView").classList.add("hidden");$("signOutBtn").classList.add("hidden");$("currentUser").textContent=""}
async function onSignedIn(user){if(!user){loginView();return}if(!ADMIN_UIDS.includes(user.uid)){await auth.signOut();loginView();msg($("loginMessage"),"このGoogleアカウントには管理者権限がありません。","error");return}
$("currentUser").textContent=user.email||"";$("signOutBtn").classList.remove("hidden");$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");await loadUsers()}
async function loadUsers(){clearMsg($("message"));$("usersBody").replaceChildren();let row=el("tr"),cell=el("td","empty","ユーザーを読み込んでいます…");cell.colSpan=5;row.append(cell);$("usersBody").append(row);
try{let snap=await db.collection("users").get();users=snap.docs.map(d=>({uid:d.id,...d.data()}));stats();render()}catch(e){users=[];stats();$("usersBody").replaceChildren();msg($("message"),"取得できません。Firestoreのセキュリティルールと管理者UIDを確認してください。\n"+e.message,"error")}}
function stats(){let s=users.map(statusOf);$("countAll").textContent=users.length;$("countPending").textContent=s.filter(x=>x==="pending").length;$("countApproved").textContent=s.filter(x=>x==="approved").length;$("countSuspended").textContent=s.filter(x=>x==="suspended").length}
function render(){let q=$("searchInput").value.trim().toLowerCase(),f=$("statusFilter").value;let list=users.filter(u=>(!q||(`${u.email||""} ${u.uid}`).toLowerCase().includes(q))&&(f==="all"||statusOf(u)===f));list.sort((a,b)=>(({pending:0,approved:1,suspended:2})[statusOf(a)]-({pending:0,approved:1,suspended:2})[statusOf(b)])||String(a.email||"").localeCompare(String(b.email||"")));
$("usersBody").replaceChildren();$("resultCount").textContent=list.length+" / "+users.length+" 件";if(!list.length){let r=el("tr"),c=el("td","empty","該当するユーザーはいません。");c.colSpan=5;r.append(c);$("usersBody").append(r);return}
list.forEach(u=>{let s=statusOf(u),r=el("tr"),uc=el("td"),uid=el("td"),sc=el("td"),dc=el("td","",dateOf(u.createdAt)),ac=el("td"),actions=el("div","actions");uc.append(el("div","email",u.email||"メール未登録"));uid.append(el("div","uid",u.uid));sc.append(el("span","badge "+s,s==="approved"?"利用中":s==="suspended"?"停止中":"承認待ち"));
if(s==="pending"){actions.append(button("承認","approve",()=>setStatus(u.uid,true,"approved")));actions.append(button("停止","suspend",()=>setStatus(u.uid,false,"suspended")))}else if(s==="approved"){actions.append(button("利用停止","suspend",()=>setStatus(u.uid,false,"suspended")))}else{actions.append(button("利用再開","approve",()=>setStatus(u.uid,true,"approved")))}
ac.append(actions);r.append(uc,uid,sc,dc,ac);$("usersBody").append(r)})}
function button(text,cls,fn){let b=el("button",cls,text);b.type="button";b.addEventListener("click",fn);return b}
async function setStatus(uid, approved, status) {
  if (!confirm(uid + " の利用状態を「" + (status === "approved" ? "承認" : "停止") + "」に変更しますか？")) return;
  try {
    const data = {
      approved,
      status,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (approved) data.approvedAt = firebase.firestore.FieldValue.serverTimestamp();
    // 既存のユーザードキュメントのみを更新します。
    await db.collection("users").doc(uid).update(data);
    msg($("message"), "利用状態を更新しました。", "ok");
    await loadUsers();
  } catch (e) {
    msg($("message"), "更新できません。Firestoreのセキュリティルールと対象ユーザーを確認してください。\n" + e.message, "error");
  }
}
$("signInBtn").addEventListener("click",login);$("refreshBtn").addEventListener("click",loadUsers);$("searchInput").addEventListener("input",render);$("statusFilter").addEventListener("change",render);$("signOutBtn").addEventListener("click",async()=>{await auth.signOut();loginView()});
try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(onSignedIn)}catch(e){loginView();msg($("loginMessage"),"Firebase初期化エラー: "+e.message,"error")}
</script>
</body></html>
